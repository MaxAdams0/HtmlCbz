<!DOCTYPE html>
<html>
	<head>
		<base target="_top">
		<title>Html-only Cbz Reader</title>
		<style>
			html, body {
			overflow-x: hidden;
			margin: 0;
			padding: 0;
			height: 100vh;
			color: white;
			background-color: rgb(0,0,0);
			font-family: Verdana, sans-serif;
			display: flex;
			flex-direction: column;
		}

		#bar {
			display: flex;
			align-items: center;
			gap: 10px;
			position: sticky;
			background: rgb(11,11,11);
			height: 35px;
			padding: 5px 10px;
		}

		#bar input {
			background: rgb(22,22,22);
			padding: 5px;
			border: none;
			width: 500px;
		}

		#bar input[type="range"] {
			accent-color: rgb(22,22,22);
			width: 200px;
		}

		#bar input[type="number"] {
			color: white;
			width: 50px;
			margin-left: 10px;
		}

		#imageContainer {
			flex-grow: 1;
			text-align: center;
			overflow: auto;
		}

		img {
			max-width: 100%;
			max-height: 100vh;
			display: block;
			margin: auto;
			padding-bottom: 5px;
		}

		#pageCounter {
			margin-left: auto;
			white-space: nowrap;
		}

		#messageContainer {
			width: 100%;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			pointer-events: none;
		}

		.message {
			font-size: 32px;
			text-shadow: 0 0 4px #000;
			pointer-events: none;
		}

		#loadingMessage {
			opacity: 0%;
			transition: opacity 0.5s ease-in-out;
		}
		</style>
	</head>	
	
	<body>
		<div id="messageContainer">
			<p class="message" id="loadingMessage">Loading... (0 / 0)</p>
		</div>
		<div id="imageContainer"></div>
		<div id="bar">
			<input type="file" id="fileInput" accept=".cbz">
			<text>Zoom:</text>
			<input type="range" id="zoomSlider" min="25" max="250" value="100">
			<input type="number" id="zoomInput" min="25" max="250" value="100" step="1">
			<text id="pageCounter">Page 0 / 0</text>
		</div>
	</body>
	
	<script>
		const imageContainer = document.getElementById('imageContainer');
		const loadingMessage = document.getElementById("loadingMessage");
		const pageCounter = document.getElementById('pageCounter');
		const zoomSlider = document.getElementById("zoomSlider");
		const zoomInput = document.getElementById("zoomInput");
		let imageOffsets = [];

		let currentPageCount = 0;
		let imageURLs = [];
		const tag = '[CBZ]';
		function log(level, message, detail) {
			const method = console[level] || console.log;
			if (detail === undefined) method.call(console, tag, message);
			else method.call(console, tag, message, detail);
		}
		function status(message, error = false) {
			loadingMessage.textContent = message;
			loadingMessage.style.color = error ? '#ff9999' : 'white';
			loadingMessage.style.opacity = '1';
		}
		function bytes(n) { return (n / (1024 * 1024)).toFixed(2) + ' MiB'; }

		// Register these once, rather than registering more listeners for every book.
		imageContainer.addEventListener('scroll', () => {
			if (currentPageCount) setPageCounter(currentPageCount);
		});

		document.getElementById('fileInput').addEventListener('change', async function(event) {
			const file = event.target.files[0];
			if (!file) return;
			// Allow selecting the same file again after an error.
			event.target.value = '';
			currentPageCount = 0;
			pageCounter.textContent = 'Page 0 / 0';
			status('Loading... (0 / 0)');
			loadingMessage.style.color = 'white';
			loadingMessage.style.fontSize = '24px';
			loadingMessage.style.opacity = '1';
			try {
				log('group', `Opening ${file.name} (${bytes(file.size)})`);
				const totalPages = await loadBook(file);
				currentPageCount = totalPages;
				setupZoom(totalPages);
				log('info', `Finished ${file.name}: ${totalPages} pages displayed.`);
				console.groupEnd();
				loadingMessage.style.opacity = '0';
			} catch (error) {
				log('error', `Failed to open '${file.name}'`, error);
				console.groupEnd();
				loadingMessage.style.opacity = '0';
			}
		});

		async function readRange(file, start, length) {
			if (!Number.isSafeInteger(start) || !Number.isSafeInteger(length) ||
				start < 0 || length < 0 || start + length > file.size) {
				throw new Error('The ZIP archive has an invalid or truncated offset.');
			}
			return new Uint8Array(await file.slice(start, start + length).arrayBuffer());
		}

		function safeZipInteger(bigIntValue) {
			if (bigIntValue > BigInt(Number.MAX_SAFE_INTEGER)) {
				throw new Error('A ZIP64 offset or size exceeds JavaScript\'s supported range.');
			}
			return Number(bigIntValue);
		}

		async function readZipEntries(file) {
			// The ZIP end-of-central-directory record is in the last 65,557 bytes.
			const tailSize = Math.min(file.size, 65557);
			const tailStart = file.size - tailSize;
			const tail = await readRange(file, tailStart, tailSize);
			const tv = new DataView(tail.buffer);
			let eocd = -1;
			for (let i = tailSize - 22; i >= 0; i--) {
				if (tv.getUint32(i, true) === 0x06054b50 &&
					i + 22 + tv.getUint16(i + 20, true) === tailSize) {
					eocd = i;
					break;
				}
			}
			if (eocd < 0) {
				throw new Error('No ZIP directory found. Ensure this is a ZIP-based CBZ, not 7z or RAR.');
			}
			if (tv.getUint16(eocd + 4, true) !== 0 ||
				tv.getUint16(eocd + 6, true) !== 0) {
				throw new Error('Multi-volume ZIP archives are not supported.');
			}

			log('info', `Found ZIP end record at byte ${tailStart + eocd}`);
			let count = tv.getUint16(eocd + 10, true);
			let dirSize = tv.getUint32(eocd + 12, true);
			let dirOffset = tv.getUint32(eocd + 16, true);
			if (count === 0xffff || dirSize === 0xffffffff || dirOffset === 0xffffffff) {
				// ZIP64 locator directly precedes the ordinary ZIP directory footer.
				const loc = await readRange(file, tailStart + eocd - 20, 20);
				const lv = new DataView(loc.buffer);
				if (lv.getUint32(0, true) !== 0x07064b50) {
					throw new Error('ZIP64 directory locator is missing or corrupt.');
				}
				const zip64Offset = safeZipInteger(lv.getBigUint64(8, true));
				const zip64 = await readRange(file, zip64Offset, 56);
				const zv = new DataView(zip64.buffer);
				if (zv.getUint32(0, true) !== 0x06064b50) {
					throw new Error('Invalid ZIP64 directory record.');
				}
				count = safeZipInteger(zv.getBigUint64(32, true));
				dirSize = safeZipInteger(zv.getBigUint64(40, true));
				dirOffset = safeZipInteger(zv.getBigUint64(48, true));
			}

			log('info', `ZIP directory: ${count} entries, offset=${dirOffset}, length=${dirSize}`);
			const data = await readRange(file, dirOffset, dirSize);
			const v = new DataView(data.buffer);
			const entries = [];
			let off = 0;
			for (let i = 0; i < count; i++) {
				if (off + 46 > data.length || v.getUint32(off, true) !== 0x02014b50) {
					throw new Error(`Corrupt ZIP central directory at entry ${i + 1}.`);
				}
				const flags = v.getUint16(off + 8, true);
				const comp = v.getUint16(off + 10, true);
				let csize = v.getUint32(off + 20, true);
				let usize = v.getUint32(off + 24, true);
				const nlen = v.getUint16(off + 28, true);
				const elen = v.getUint16(off + 30, true);
				const clen = v.getUint16(off + 32, true);
				let loff = v.getUint32(off + 42, true);
				const next = off + 46 + nlen + elen + clen;
				if (next > data.length) throw new Error('Truncated ZIP directory entry.');
				const name = new TextDecoder('utf-8').decode(data.subarray(off + 46, off + 46 + nlen));

				// In ZIP64, the 32-bit placeholder values live in the extra field.
				if (csize === 0xffffffff || usize === 0xffffffff || loff === 0xffffffff) {
					let p = off + 46 + nlen;
					let found = false;
					while (p + 4 <= off + 46 + nlen + elen) {
						const id = v.getUint16(p, true);
						const len = v.getUint16(p + 2, true);
						p += 4;
						if (p + len > off + 46 + nlen + elen) break;
						if (id === 0x0001) {
							const end = p + len;
							if (usize === 0xffffffff) {
								if (p + 8 > end) throw new Error(`Bad ZIP64 size: ${name}`);
								usize = safeZipInteger(v.getBigUint64(p, true)); p += 8;
							}
							if (csize === 0xffffffff) {
								if (p + 8 > end) throw new Error(`Bad ZIP64 size: ${name}`);
								csize = safeZipInteger(v.getBigUint64(p, true)); p += 8;
							}
							if (loff === 0xffffffff) {
								if (p + 8 > end) throw new Error(`Bad ZIP64 offset: ${name}`);
								loff = safeZipInteger(v.getBigUint64(p, true)); p += 8;
							}
							found = true;
							break;
						}
						p += len;
					}
					if (!found) throw new Error(`Missing ZIP64 extra information: ${name}`);
				}
				entries.push({ name, comp, csize, usize, loff, flags });
				off = next;
			}
			log('info', `Parsed ${entries.length} ZIP entries.`);
			return entries;
		}

		async function loadBook(file) {
			for (const url of imageURLs) URL.revokeObjectURL(url);
			imageURLs = [];
			imageContainer.replaceChildren();
			imageOffsets = [];
			const started = performance.now();
			const entries = await readZipEntries(file);
			const imageFiles = entries
				.filter(e => /\.(?:jpg|jpeg|jfif|png|gif|webp|avif|bmp)$/i.test(e.name))
				.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
			const methods = {};
			for (const entry of entries) methods[entry.comp] = (methods[entry.comp] || 0) + 1;
			log('info', `Archive contains ${entries.length} entries, ${imageFiles.length} recognized images. Compression methods: ${JSON.stringify(methods)}`);
			console.table(imageFiles.map((e, i) => ({page: i + 1, name: e.name, method: e.comp, compressed: e.csize, uncompressed: e.usize, offset: e.loff, flags: e.flags})));
			if (!imageFiles.length) throw new Error('ZIP opened but contains no recognized images. See console entry listing.');

			let succeeded = 0;
			let failed = 0;
			const errors = [];
			for (let i = 0; i < imageFiles.length; i++) {
				const entry = imageFiles[i];
				status(`Loading... (${i + 1} / ${imageFiles.length})`);
				log('debug', `Processing page ${i + 1}/${imageFiles.length}: ${entry.name}`);
				log('info', `[${i + 1}/${imageFiles.length}] ${entry.name}: compression=${entry.comp}, size=${bytes(entry.csize)}`);
				let url;
				try {
					if (entry.flags & 1) throw new Error('Encrypted ZIP entry');
					if (entry.comp !== 0 && entry.comp !== 8) throw new Error(`Unsupported ZIP compression method ${entry.comp} (only Store=0 and Deflate=8 supported)`);
					const header = await readRange(file, entry.loff, 30);
					const hv = new DataView(header.buffer);
					if (hv.getUint32(0, true) !== 0x04034b50) throw new Error('Invalid local file header signature');
					const dataOff = entry.loff + 30 + hv.getUint16(26, true) + hv.getUint16(28, true);
					if (dataOff + entry.csize > file.size) throw new Error('Compressed image extends past end of archive');
					const ext = entry.name.split('.').pop().toLowerCase();
					const mime = ({jpg:'image/jpeg',jpeg:'image/jpeg',jfif:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',avif:'image/avif',bmp:'image/bmp'})[ext];
					const section = file.slice(dataOff, dataOff + entry.csize);
					let blob;
					if (entry.comp === 0) {
						blob = new Blob([section], {type: mime});
					} else {
						if (!('DecompressionStream' in window)) throw new Error('Browser does not implement DecompressionStream');
						// Decompression output must be read concurrently with input to avoid a stream backpressure deadlock.
						const decompressed = section.stream().pipeThrough(new DecompressionStream('deflate-raw'));
						blob = new Blob([await new Response(decompressed).arrayBuffer()], {type: mime});
					}
					if (blob.size !== entry.usize) log('warn', `Uncompressed size mismatch for ${entry.name}: ZIP=${entry.usize}, actual=${blob.size}`);
					url = URL.createObjectURL(blob);
					const img = document.createElement('img');
					img.alt = entry.name;
					img.src = url;
					const loaded = await new Promise(resolve => {
						img.onload = () => resolve(true);
						img.onerror = () => resolve(false);
						imageContainer.appendChild(img);
					});
					if (!loaded) throw new Error(`Browser could not decode ${mime} image (${bytes(blob.size)})`);
					imageURLs.push(url);
					succeeded++;
					log('info', `OK ${entry.name} (${img.naturalWidth}x${img.naturalHeight}, ${bytes(blob.size)})`);
				} catch (error) {
					if (url) URL.revokeObjectURL(url);
					failed++;
					errors.push({page:i+1,name:entry.name,error:error.message});
					log('error', `Page ${i + 1}: ${entry.name} failed`, error);
				}
			}
			console.table(errors);
			log('info', `Finished in ${((performance.now() - started)/1000).toFixed(2)}s. Loaded=${succeeded}, failed=${failed}.`);
			if (!succeeded) throw new Error(`All ${failed} image(s) failed. See console for individual errors.`);
			computeImageOffsets();
			if (failed) {
				log('warn', `Loaded ${succeeded}/${imageFiles.length} pages; ${failed} failed. See console for details.`);
				// Keep partial-load diagnostics visible.
				setTimeout(() => { if (currentPageCount === succeeded) loadingMessage.style.opacity = '0'; }, 8000);
			}
			return succeeded;
		}

		function computeImageOffsets() {
			// Use actual element positions instead of estimated heights and padding.
			const images = Array.from(imageContainer.querySelectorAll('img'));
			imageOffsets = images.map(img => img.offsetTop - imageContainer.offsetTop);
		}

		function setPageCounter(pageCount) {
			const images = imageContainer.querySelectorAll('img');
			if (!images.length || !pageCount) {
				pageCounter.textContent = 'Page 0 / 0';
				return;
			}
			// At the physical bottom, the last page is visible even if its top
			// cannot reach the top of the scroll viewport.
			const atBottom = imageContainer.scrollTop + imageContainer.clientHeight >= imageContainer.scrollHeight - 2;
			if (atBottom) {
				pageCounter.textContent = `Page ${pageCount} / ${pageCount}`;
				return;
			}
			const viewportTop = imageContainer.getBoundingClientRect().top;
			let page = 1;
			for (let i = 0; i < images.length; i++) {
				if (images[i].getBoundingClientRect().bottom > viewportTop + 2) {
					page = i + 1;
					break;
				}
			}
			pageCounter.textContent = `Page ${Math.min(page, pageCount)} / ${pageCount}`;
		}

		function updateZoom(value, pageCount) {
			const images = Array.from(imageContainer.querySelectorAll('img'));
			if (!images.length) return;
			const viewportTop = imageContainer.getBoundingClientRect().top;
			const atBottom = imageContainer.scrollTop + imageContainer.clientHeight >= imageContainer.scrollHeight - 2;
			let target = images.find(img => img.getBoundingClientRect().bottom > viewportTop + 2) || images[images.length - 1];
			const oldRect = target.getBoundingClientRect();
			const fraction = oldRect.height ? Math.max(0, Math.min(1, (viewportTop - oldRect.top) / oldRect.height)) : 0;
			images.forEach(img => { img.style.maxHeight = `${value}vh`; });
			computeImageOffsets();
			if (atBottom) {
				imageContainer.scrollTop = imageContainer.scrollHeight;
			} else {
				const newRect = target.getBoundingClientRect();
				imageContainer.scrollTop += newRect.top - viewportTop + fraction * newRect.height;
			}
			setPageCounter(pageCount);
		}

		function setupZoom(pageCount) {
			updateZoom(Number(zoomSlider.value) || 100, pageCount);
		}

		zoomSlider.addEventListener('input', () => {
			const value = Number(zoomSlider.value);
			zoomInput.value = value;
			if (currentPageCount) updateZoom(value, currentPageCount);
		});

		zoomInput.addEventListener('input', () => {
			const value = Number(zoomInput.value);
			if (value >= 25 && value <= 250) {
				zoomSlider.value = value;
				if (currentPageCount) updateZoom(value, currentPageCount);
			}
		});

	</script>
</html>
